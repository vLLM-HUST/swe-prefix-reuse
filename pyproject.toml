[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swe-prefix-reuse"
version = "0.1.2"
description = "Closed-loop SWE token-continuation serving benchmark, adapted from vLLM bench serve"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
prepare = ["transformers>=5.14.1,<6", "jinja2>=3.1.6,<4"]
data = ["pyarrow>=16"]
test = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
swe-prefix-reuse = "swe_prefix_reuse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
